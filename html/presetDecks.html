<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preset Decks - Custom Cards</title>

    <link rel="icon" type="image/png" href="../images/a-misc/logo-without-title.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/presetDecks.css?v=preset-decks-2">
    <link rel="stylesheet" href="../css/galaxy-theme.css?v=adaptive-color-11">
</head>

<body class="workspace-body">
    <div class="workspace-shell">
        <aside class="workspace-sidebar">
            <a class="workspace-logo" href="../index.html">
                <img src="../images/a-misc/logo-without-title.png" alt="">
                <span><strong>CCS</strong><small>Card Simulator</small></span>
            </a>
            <nav class="workspace-nav" aria-label="Main navigation">
                <a href="../index.html"><i>H</i><span>Home</span></a>
                <a href="play.html"><i>P</i><span>Play</span></a>
                <a class="active" href="presetDecks.html"><i>D</i><span>Preset Decks</span></a>
                <a href="deck-editor.html"><i>B</i><span>Deck Builder</span></a>
                <a href="settings.html"><i>S</i><span>Settings</span></a>
                <a href="patch-notes.html"><i>U</i><span>Updates</span></a>
            </nav>
            <div class="workspace-sidebar-footer"><i></i><span>Simulator ready</span></div>
        </aside>
        <div class="workspace-content">
    <main class="preset-decks-page">
        <header class="preset-decks-header app-page-header">
            <a class="app-page-brand" href="../index.html">
                <img src="../images/a-misc/logo-without-title.png" alt="">
                <span>CCS</span>
            </a>
            <section class="preset-title-group header-title-group">
                <span class="page-eyebrow">Collection</span>
                <h1>Preset Decks</h1>
                <p>Browse ready-made decks, view their cards, and choose one for testing.</p>
            </section>
            <a href="../index.html" class="btn-back">&#8592; Home</a>
        </header>

        <section class="preset-decks-panel">
            <div class="preset-decks-toolbar">
                <div>
                    <h2>Available Decks</h2>
                    <p id="deckCountText">Loading decks...</p>
                </div>

                <input
                    type="text"
                    id="deckSearchInput"
                    class="deck-search-input"
                    placeholder="Search decks..."
                    autocomplete="off"
                >
            </div>

            <div id="presetDecksGrid" class="preset-decks-grid"></div>

            <div id="emptyDecksMessage" class="empty-decks-message hidden">
                No preset decks found.
            </div>
        </section>
    </main>
        </div>
    </div>

    <script src="../js/pages/galaxy-theme.js?v=adaptive-color-5"></script>
    <script src="../js/cards/cardDataBundle.js?v=bundle-1"></script>
    <script src="../js/cards/cardDatabase.js?v=asset-root-1"></script>
    <script src="../js/cards/decks.js?v=killer-deck-1"></script>
    <script src="../js/pages/presetDecks.js?v=presets-8"></script>
</body>
</html>
